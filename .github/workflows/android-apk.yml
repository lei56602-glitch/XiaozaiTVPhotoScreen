name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "v2.0-development" ]
    paths:
      - "source.zip"
      - "*.zip"
      - "patches/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and update Android source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "source.zip" ]; then
            ZIP_FILE="source.zip"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "::error::No source ZIP found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Android Gradle settings file not found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          patch -p1 --batch -d "$PROJECT_DIR" < "$GITHUB_WORKSPACE/patches/xiaozai-v1.1.patch"
          cp "$GITHUB_WORKSPACE/v2-src/MainActivity.java" "$PROJECT_DIR/app/src/main/java/com/xiaozai/photoscreen/MainActivity.java"
          sed -i "s/versionCode 2/versionCode 3/; s/versionName/versionName/" "$PROJECT_DIR/app/build.gradle"
          sed -i "s/小崽子视觉/小李视觉/g" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Updated source files:"
          find "$PROJECT_DIR" -maxdepth 8 -type f | sort

      - name: Upload updated source
        uses: actions/upload-artifact@v4
        with:
          name: XiaoliVision-source-v2.0
          path: extracted/
          if-no-files-found: error
          retention-days: 3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit)" ]; then
            echo "::error::Build completed but no APK was found."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoliVision-debug-apk-v2.0
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 90
