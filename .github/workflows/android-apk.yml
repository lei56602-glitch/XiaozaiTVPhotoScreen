name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "source.zip"
      - "*.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "source.zip" ]; then
            ZIP_FILE="source.zip"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "::error::No source ZIP found in the repository root."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in the current SDK repository.
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Find Android project and build APK
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::Could not find gradlew in the extracted ZIP. The ZIP must contain a complete Android Gradle project, including the Gradle wrapper."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --no-daemon assembleDebug

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if [ -z "$(find "$GITHUB_WORKSPACE/apk-output" -type f -name '*.apk' -print -quit)" ]; then
            echo "::error::Build completed but no APK was found."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaozaiTVPhotoScreen-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
